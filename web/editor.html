<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор локаций · КрасноярскГессер</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body class="editor-body">

  <div id="editor-app">
    <header id="editor-header">
      <div class="editor-brand">
        <span class="editor-brand-icon">
          <svg class="svg-inline-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </span>
        <span class="editor-brand-text">Редактор локаций</span>
      </div>

      <div class="editor-tabs" id="editor-tabs">
        <button class="editor-tab active" data-mode="krasnoyarsk">Красноярск</button>
        <button class="editor-tab" data-mode="sfu">СФУ</button>
        <button class="editor-tab" data-mode="russia">Россия</button>
      </div>

      <input type="text" id="editor-search" class="editor-search"
             placeholder="Поиск по имени, адресу, id..." autocomplete="off">
      
      <button class="editor-btn-add" id="editor-add" title="Добавить локацию">+ Локация</button>

      <button class="editor-btn-primary" id="editor-save" disabled>
        <svg class="svg-inline-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span>Сохранить</span>
      </button>

      <a href="/" class="editor-exit" title="Вернуться в игру">В игру</a>
    </header>

    <div id="editor-body">
      <aside id="editor-list-pane">
        <div id="editor-list" class="editor-list"></div>
      </aside>

      <main id="editor-map-pane">
        <div id="editor-map"></div>
        <div class="editor-map-badge" id="editor-pick-badge" style="display:none;">
          <svg class="svg-inline-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span>Клик по карте — взять координаты</span>
        </div>
      </main>

      <aside id="editor-form-pane">
        <div id="editor-form-wrap" class="editor-form-wrap">
          <div class="editor-empty">Выбери локацию слева</div>
        </div>
      </aside>
    </div>
  </div>

  <div id="editor-img-overlay">
    <img id="editor-img-full" alt="">
  </div>

  <div id="editor-toast"></div>

  <script src="config.js"></script>
  <script src="editor.js" type="module"></script>
</body>
</html>
